<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./transitions.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:100;font-family:'Plus Jakarta Sans',sans-serif;">
  <div style="background:#f7f9fc;color:#64748b;font-size:12.5px;letter-spacing:.02em;border-bottom:1px solid #edf1f6;">
    <div style="max-width:1240px;margin:0 auto;padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
        <a href="tel:+911244080100" style="display:flex;align-items:center;gap:7px;color:#14304d;font-weight:600;text-decoration:none;">
          <span style="color:#a87f28;">☏</span> +91-124-4080100
        </a>
        <span style="opacity:.3;">|</span>
        <a href="mailto:info@deeprealestate.in" style="display:flex;align-items:center;gap:7px;color:#14304d;font-weight:600;text-decoration:none;">
          <span style="color:#a87f28;">✉</span> info@deeprealestate.in
        </a>
      </div>
      <span style="color:#94a3b2;">Fully-licensed Haryana real-estate agency · Est. 2005</span>
    </div>
  </div>
  <div style="background:#ffffff;border-bottom:1px solid #e3e8ef;">
    <div style="max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <a href="index.dc.html" style="display:flex;align-items:center;text-decoration:none;flex-shrink:0;">
        <img src="assets/brand/logo-alt.jpg" alt="Deep Real Estate" style="height:44px;width:auto;display:block;">
      </a>
      <nav style="display:flex;align-items:center;gap:4px;font-size:14.5px;font-weight:500;">
        <a href="index.dc.html" style="position:relative;padding:8px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;">Home<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></a>
        <a href="about.dc.html" style="position:relative;padding:8px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;">About Us<sc-if value="{{ isAbout }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></a>
        <div style="position:relative;">
          <button onClick="{{ toggleProjects }}" style="font:inherit;cursor:pointer;background:none;border:none;padding:8px 12px;color:#1c2b39;border-radius:8px;display:flex;align-items:center;gap:5px;">Projects <span style="font-size:9px;color:#8a94a3;">▾</span><sc-if value="{{ isProjects }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:22px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></button>
          <sc-if value="{{ projectsOpen }}">
            <div style="position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:#fff;border:1px solid #e3e8ef;border-radius:12px;box-shadow:0 18px 44px -18px rgba(20,48,77,.28);padding:8px;display:flex;flex-direction:column;">
              <a href="projects.dc.html#all" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">All Properties</a>
              <a href="projects.dc.html#residential" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Residential</a>
              <a href="projects.dc.html#commercial" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Commercial</a>
              <a href="projects.dc.html#plots" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Plots</a>
            </div>
          </sc-if>
        </div>
        <a href="maps.dc.html" style="position:relative;padding:8px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;">Maps<sc-if value="{{ isMaps }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></a>
        <div style="position:relative;">
          <button onClick="{{ toggleMore }}" style="font:inherit;cursor:pointer;background:none;border:none;padding:8px 12px;color:#1c2b39;border-radius:8px;display:flex;align-items:center;gap:5px;position:relative;">More <span style="font-size:9px;color:#8a94a3;">▾</span><sc-if value="{{ isMore }}"><span style="position:absolute;left:12px;right:22px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></button>
          <sc-if value="{{ moreOpen }}">
            <div style="position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:#fff;border:1px solid #e3e8ef;border-radius:12px;box-shadow:0 18px 44px -18px rgba(20,48,77,.28);padding:8px;display:flex;flex-direction:column;">
              <a href="documents.dc.html" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Documents</a>
              <a href="faq.dc.html" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">FAQ</a>
              <a href="privacy.dc.html" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Privacy Policy</a>
              <a href="terms.dc.html" style="padding:10px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;font-size:14px;">Terms &amp; Conditions</a>
            </div>
          </sc-if>
        </div>
        <a href="contact.dc.html" style="position:relative;padding:8px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;">Contact<sc-if value="{{ isContact }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></a>
        <a href="free-support.dc.html" style="position:relative;padding:8px 12px;color:#1c2b39;text-decoration:none;border-radius:8px;">Free Support<sc-if value="{{ isSupport }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#c49a3c;border-radius:2px;"></span></sc-if></a>
      </nav>
      <a href="contact.dc.html" style="flex-shrink:0;background:#c49a3c;color:#14304d;font-weight:700;font-size:14px;text-decoration:none;padding:12px 20px;border-radius:10px;box-shadow:0 10px 22px -12px rgba(196,154,60,.7);">Buy / Sell Property</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;projects&quot;,&quot;maps&quot;,&quot;contact&quot;,&quot;support&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const a = this.props.active || '';
    const toggle = (k) => this.setState(s => ({ open: s.open === k ? null : k }));
    return {
      isHome: a === 'home', isAbout: a === 'about', isProjects: a === 'projects',
      isMaps: a === 'maps', isContact: a === 'contact', isSupport: a === 'support',
      // documents / faq / privacy / terms all live under the "More" dropdown
      isMore: ['documents', 'faq', 'privacy', 'terms'].indexOf(a) !== -1,
      projectsOpen: this.state.open === 'projects',
      moreOpen: this.state.open === 'more',
      toggleProjects: () => toggle('projects'),
      toggleMore: () => toggle('more'),
    };
  }
}
</script>
</body>
</html>
