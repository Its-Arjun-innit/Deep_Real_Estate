<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./transitions.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{margin:0;}a{color:#14304d;}a:hover{color:#c49a3c;}</style>
</helmet>
<div style="font-family:'Plus Jakarta Sans',sans-serif;color:#1c2b39;background:#fff;">
  <dc-import name="Header" active="" hint-size="100%,110px"></dc-import>

  <section style="background:linear-gradient(160deg,#0e2439,#14304d);color:#fff;">
    <div style="max-width:1240px;margin:0 auto;padding:60px 24px;">
      <div style="font-size:13px;color:#93a4b6;margin-bottom:14px;"><a href="index.dc.html" style="color:#93a4b6;text-decoration:none;">Home</a> · Privacy Policy</div>
      <h1 style="font-family:'Sora',sans-serif;font-weight:800;font-size:42px;letter-spacing:-.02em;margin:0 0 10px;">Privacy Policy</h1>
      <p style="font-size:15px;color:#93a4b6;margin:0;">Last updated: 4 July 2022</p>
    </div>
  </section>

  <section style="max-width:1100px;margin:0 auto;padding:56px 24px 84px;display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;">
    <aside style="position:sticky;top:130px;">
      <div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94a3b2;margin-bottom:14px;">On this page</div>
      <div style="display:flex;flex-direction:column;gap:9px;font-size:14px;">
        <sc-for list="{{ toc }}" as="t" hint-placeholder-count="10">
          <a href="{{ t.href }}" style="color:#4a5a6a;text-decoration:none;">{{ t.label }}</a>
        </sc-for>
      </div>
    </aside>
    <div>
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="10">
        <div id="{{ s.id }}" style="scroll-margin-top:130px;margin-bottom:34px;">
          <h2 style="font-family:'Sora',sans-serif;font-weight:700;font-size:22px;margin:0 0 12px;">{{ s.title }}</h2>
          <sc-for list="{{ s.blocks }}" as="b">
            <sc-if value="{{ b.isH }}"><h3 style="font-family:'Sora',sans-serif;font-weight:600;font-size:16.5px;color:#14304d;margin:18px 0 8px;">{{ b.text }}</h3></sc-if>
            <sc-if value="{{ b.isP }}"><p style="font-size:15.5px;line-height:1.75;color:#4a5a6a;margin:0 0 12px;">{{ b.text }}</p></sc-if>
            <sc-if value="{{ b.isUl }}"><ul style="font-size:15.5px;line-height:1.7;color:#4a5a6a;margin:0 0 12px;padding-left:22px;"><sc-for list="{{ b.items }}" as="li"><li style="margin:0 0 7px;">{{ li }}</li></sc-for></ul></sc-if>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  sectionData() {
    const p = (text) => ({ t: 'p', text });
    const h = (text) => ({ t: 'h', text });
    const ul = (items) => ({ t: 'ul', items });
    return [
      ['Interpretation and Definitions', [
        p('This Privacy Policy describes Our policies and procedures on the collection, use and disclosure of Your information when You use the Service and tells You about Your privacy rights and how the law protects You.'),
        p('We use Your Personal data to provide and improve the Service. By using the Service, You agree to the collection and use of information in accordance with this Privacy Policy.'),
        h('Interpretation'),
        p('The words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.'),
        h('Definitions'),
        p('For the purposes of this Privacy Policy:'),
        ul([
          'Account means a unique account created for You to access our Service or parts of our Service.',
          'Company (referred to as either “the Company”, “We”, “Us” or “Our” in this Agreement) refers to Deep Real Estate, G-564, Sushant Lok-II Extn. Sector 57, Nr. Scottish High Gurgaon, Haryana-122002, India.',
          'Cookies are small files that are placed on Your computer, mobile device or any other device by a website, containing the details of Your browsing history on that website among its many uses.',
          'Country refers to: Haryana, India',
          'Device means any device that can access the Service such as a computer, a cellphone or a digital tablet.',
          'Personal Data is any information that relates to an identified or identifiable individual.',
          'Service refers to the Website.',
          'Service Provider means any natural or legal person who processes the data on behalf of the Company. It refers to third-party companies or individuals employed by the Company to facilitate the Service, to provide the Service on behalf of the Company, to perform services related to the Service or to assist the Company in analyzing how the Service is used.',
          'Usage Data refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).',
          'Website refers to Deep Real Estate, accessible from http://www.deeprealestate.in',
          'You means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.',
        ]),
      ]],
      ['Types of Data Collected', [
        h('Personal Data'),
        p('While using Our Service, We may ask You to provide Us with certain personally identifiable information that can be used to contact or identify You. Personally identifiable information may include, but is not limited to:'),
        ul(['Email address', 'First name and last name', 'Phone number', 'Address, State, Province, ZIP/Postal code, City', 'Usage Data']),
        h('Usage Data'),
        p('Usage Data is collected automatically when using the Service.'),
        p('Usage Data may include information such as Your Device’s Internet Protocol address (e.g. IP address), browser type, browser version, the pages of our Service that You visit, the time and date of Your visit, the time spent on those pages, unique device identifiers and other diagnostic data.'),
        p('When You access the Service by or through a mobile device, We may collect certain information automatically, including, but not limited to, the type of mobile device You use, Your mobile device unique ID, the IP address of Your mobile device, Your mobile operating system, the type of mobile Internet browser You use, unique device identifiers and other diagnostic data.'),
        p('We may also collect information that Your browser sends whenever You visit our Service or when You access the Service by or through a mobile device.'),
      ]],
      ['Tracking Technologies and Cookies', [
        p('We use Cookies and similar tracking technologies to track the activity on Our Service and store certain information. Tracking technologies used are beacons, tags, and scripts to collect and track information and to improve and analyze Our Service. The technologies We use may include:'),
        ul([
          'Cookies or Browser Cookies. A cookie is a small file placed on Your Device. You can instruct Your browser to refuse all Cookies or to indicate when a Cookie is being sent. However, if You do not accept Cookies, You may not be able to use some parts of our Service. Unless you have adjusted Your browser setting so that it will refuse Cookies, our Service may use Cookies.',
          'Flash Cookies. Certain features of our Service may use local stored objects (or Flash Cookies) to collect and store information about Your preferences or Your activity on our Service. Flash Cookies are not managed by the same browser settings as those used for Browser Cookies.',
          'Web Beacons. Certain sections of our Service and our emails may contain small electronic files known as web beacons (also referred to as clear gifs, pixel tags, and single-pixel gifs) that permit the Company, for example, to count users who have visited those pages or opened an email and for other related website statistics.',
        ]),
        p('Cookies can be “Persistent” or “Session” Cookies. Persistent Cookies remain on Your personal computer or mobile device when You go offline, while Session Cookies are deleted as soon as You close Your web browser.'),
        p('We use both Session and Persistent Cookies for the purposes set out below:'),
        ul([
          'Necessary / Essential Cookies (Session Cookies, administered by Us): These Cookies are essential to provide You with services available through the Website and to enable You to use some of its features. They help to authenticate users and prevent fraudulent use of user accounts.',
          'Cookies Policy / Notice Acceptance Cookies (Persistent Cookies, administered by Us): These Cookies identify if users have accepted the use of cookies on the Website.',
          'Functionality Cookies (Persistent Cookies, administered by Us): These Cookies allow us to remember choices You make when You use the Website, such as remembering your login details or language preference.',
        ]),
        p('For more information about the cookies we use and your choices regarding cookies, please visit our Cookies Policy or the Cookies section of our Privacy Policy.'),
      ]],
      ['Use of Your Personal Data', [
        p('The Company may use Personal Data for the following purposes:'),
        ul([
          'To provide and maintain our Service, including to monitor the usage of our Service.',
          'To manage Your Account: to manage Your registration as a user of the Service.',
          'For the performance of a contract: the development, compliance and undertaking of the purchase contract for the products, items or services You have purchased or of any other contract with Us through the Service.',
          'To contact You: To contact You by email, telephone calls, SMS, or other equivalent forms of electronic communication regarding updates or informative communications related to the functionalities, products or contracted services, including security updates, when necessary or reasonable.',
          'To provide You with news, special offers and general information about other goods, services and events which we offer that are similar to those that you have already purchased or enquired about unless You have opted not to receive such information.',
          'To manage Your requests: To attend and manage Your requests to Us.',
          'For business transfers: We may use Your information to evaluate or conduct a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of Our assets.',
          'For other purposes, such as data analysis, identifying usage trends, determining the effectiveness of our promotional campaigns and to evaluate and improve our Service, products, services, marketing and your experience.',
        ]),
      ]],
      ['Sharing Your Personal Data', [
        p('We may share Your personal information in the following situations:'),
        ul([
          'With Service Providers: We may share Your personal information with Service Providers to monitor and analyze the use of our Service, to contact You.',
          'For business transfers: We may share or transfer Your personal information in connection with, or during negotiations of, any merger, sale of Company assets, financing, or acquisition of all or a portion of Our business to another company.',
          'With Affiliates: We may share Your information with Our affiliates, in which case we will require those affiliates to honor this Privacy Policy.',
          'With business partners: We may share Your information with Our business partners to offer You certain products, services or promotions.',
          'With other users: when You share personal information or otherwise interact in the public areas with other users, such information may be viewed by all users and may be publicly distributed outside.',
          'With Your consent: We may disclose Your personal information for any other purpose with Your consent.',
        ]),
      ]],
      ['Retention & Transfer of Your Personal Data', [
        h('Retention of Your Personal Data'),
        p('The Company will retain Your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use Your Personal Data to the extent necessary to comply with our legal obligations, resolve disputes, and enforce our legal agreements and policies.'),
        p('The Company will also retain Usage Data for internal analysis purposes. Usage Data is generally retained for a shorter period of time, except when this data is used to strengthen the security or to improve the functionality of Our Service, or We are legally obligated to retain this data for longer time periods.'),
        h('Transfer of Your Personal Data'),
        p('Your information, including Personal Data, is processed at the Company’s operating offices and in any other places where the parties involved in the processing are located. It means that this information may be transferred to — and maintained on — computers located outside of Your state, province, country or other governmental jurisdiction where the data protection laws may differ than those from Your jurisdiction.'),
        p('Your consent to this Privacy Policy followed by Your submission of such information represents Your agreement to that transfer.'),
        p('The Company will take all steps reasonably necessary to ensure that Your data is treated securely and in accordance with this Privacy Policy and no transfer of Your Personal Data will take place to an organization or a country unless there are adequate controls in place including the security of Your data and other personal information.'),
      ]],
      ['Disclosure of Your Personal Data', [
        h('Business Transactions'),
        p('If the Company is involved in a merger, acquisition or asset sale, Your Personal Data may be transferred. We will provide notice before Your Personal Data is transferred and becomes subject to a different Privacy Policy.'),
        h('Law enforcement'),
        p('Under certain circumstances, the Company may be required to disclose Your Personal Data if required to do so by law or in response to valid requests by public authorities (e.g. a court or a government agency).'),
        h('Other legal requirements'),
        p('The Company may disclose Your Personal Data in the good faith belief that such action is necessary to:'),
        ul([
          'Comply with a legal obligation',
          'Protect and defend the rights or property of the Company',
          'Prevent or investigate possible wrongdoing in connection with the Service',
          'Protect the personal safety of Users of the Service or the public',
          'Protect against legal liability',
        ]),
      ]],
      ['Security of Your Personal Data', [
        p('The security of Your Personal Data is important to Us, but remember that no method of transmission over the Internet, or method of electronic storage is 100% secure. While We strive to use commercially acceptable means to protect Your Personal Data, We cannot guarantee its absolute security.'),
      ]],
      ['Children’s Privacy & Links to Other Websites', [
        h('Children’s Privacy'),
        p('Our Service does not address anyone under the age of 13. We do not knowingly collect personally identifiable information from anyone under the age of 13. If You are a parent or guardian and You are aware that Your child has provided Us with Personal Data, please contact Us. If We become aware that We have collected Personal Data from anyone under the age of 13 without verification of parental consent, We take steps to remove that information from Our servers.'),
        p('If We need to rely on consent as a legal basis for processing Your information and Your country requires consent from a parent, We may require Your parent’s consent before We collect and use that information.'),
        h('Links to Other Websites'),
        p('Our Service may contain links to other websites that are not operated by Us. If You click on a third party link, You will be directed to that third party’s site. We strongly advise You to review the Privacy Policy of every site You visit.'),
        p('We have no control over and assume no responsibility for the content, privacy policies or practices of any third party sites or services.'),
      ]],
      ['Changes & Contact Us', [
        h('Changes to this Privacy Policy'),
        p('We may update Our Privacy Policy from time to time. We will notify You of any changes by posting the new Privacy Policy on this page.'),
        p('We will let You know via email and/or a prominent notice on Our Service, prior to the change becoming effective and update the “Last updated” date at the top of this Privacy Policy.'),
        p('You are advised to review this Privacy Policy periodically for any changes. Changes to this Privacy Policy are effective when they are posted on this page.'),
        h('Contact Us'),
        p('If you have any questions about this Privacy Policy, You can contact us by email at info@deeprealestate.in, by phone at +91-9810922338, or by mail at G-564, Sushant Lok-II Extn. Sector 57, Nr. Scottish High Gurgaon, Haryana-122002, India.'),
      ]],
    ];
  }
  renderVals() {
    const data = this.sectionData();
    return {
      sections: data.map((s, i) => ({
        id: 'p' + (i + 1),
        title: (i + 1) + '. ' + s[0],
        blocks: s[1].map(b => ({ isH: b.t === 'h', isP: b.t === 'p', isUl: b.t === 'ul', text: b.text, items: b.items })),
      })),
      toc: data.map((s, i) => ({ href: '#p' + (i + 1), label: s[0] })),
    };
  }
}
</script>
</body>
</html>
